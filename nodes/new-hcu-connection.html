<script type="text/javascript">
    RED.nodes.registerType("New HCU connection", {
        category: "Homematic IP HCU",
        color: "#8EB4E3",
        defaults: {
            // Optional display name shown in the workspace
            name: { value: "" },

            // Internal plugin identifier
            pluginIdentifier: {
                value: "",
                required: true,
                validate: RED.validators.regex(/\S/)
            },

            // JSON language map containing at least the required de key
            pluginName: {
                value: '{"de":""}',
                required: true,
                validate: function (value) {
                    try {
                        const parsed = JSON.parse(value);

                        return Boolean(
                            parsed &&
                            typeof parsed === "object" &&
                            !Array.isArray(parsed) &&
                            typeof parsed.de === "string" &&
                            parsed.de.trim()
                        );
                    } catch (error) {
                        return false;
                    }
                }
            },

            // Activation key generated by the HCU
            activationKey: {
                value: "",
                required: true,
                validate: RED.validators.regex(/\S/)
            },

            // IPv4 address of the HCU
            serverAddress: {
                value: "",
                required: true,
                validate: function (value) {
                    const ipv4Pattern =
                        /^(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)$/;

                    return ipv4Pattern.test(value.trim());
                }
            },

            // Enables TLS connections to HCU instances with self-signed certificates
            allowSelfSigned: { value: false }
        },

        // The authentication sequence starts when a message is received
        inputs: 1,
        outputs: 1,

        icon: "bridge.svg",

        // Label shown in the Node-RED palette
        paletteLabel: "New HCU connection",

        // Label shown on the workspace
        label: function () {
            return this.name || "New HCU connection";
        }
    });
</script>


<script type="text/html" data-template-name="New HCU connection">
    <!-- Optional custom node name -->
    <div class="form-row">
        <label for="node-input-name">
            <i class="fa fa-tag"></i> Name

        <input
            type="text"

    <!-- Internal plugin identifier -->
    <div class="form-row">
        <label for="node-input-pluginIdentifier">
            <i class="fa fa-plug"></i> Plugin identifier
        </label>

        <input
            type="text"
            id="node-input-pluginIdentifier"
            placeholder="de.simpson.bart.plugin.example">
    </div>

    <div class="form-tips">
        Your internal plugin identifier
    </div>


    <!-- Localized plugin name map in JSON format -->
    <div class="form-row">
        <label for="node-input-pluginName">
            <i class="fa fa-language"></i> Plugin Name
        </label>

        <input
            type="text"
            id="node-input-pluginName"
            placeholder='{"e.g. german":"e.g. english"}'>
    </div>

    <div class="form-tips">
        ISO 639-1 language code and a human-readable, localized plugin name.
        Required key: <code>de</code>.
        Example:
        <code>{"de":"Beispiel-Plugin","en":"Example Plugin"}</code>
    </div>


    <!-- Activation key generated by the HCU -->
    <div class="form-row">
        <label for="node-input-activationKey">
            <i class="fa fa-key"></i> Activation key
        </label>

        <input
            type="text"
            id="node-input-activationKey"
            placeholder="The activation key generated by the HCU">
    </div>

    <div class="form-tips">
        The activation key generated by the HCU
    </div>


    <!-- IPv4 address of the HCU -->
    <div class="form-row">
        <label for="node-input-serverAddress">
            <i class="fa fa-server"></i> Server address
        </label>

        <input
            type="text"
            id="node-input-serverAddress"
            placeholder="192.168.1.100">
    </div>

    <div class="form-tips">
        Your HCU IPv4 address
    </div>


    <!-- Optional flag for HCU self-signed TLS certificates -->
    <div class="form-row">
        <label for="node-input-allowSelfSigned">
            <i class="fa fa-lock"></i> TLS certificate
        </label>

        <input
            type="checkbox"
            id="node-input-allowSelfSigned"
            style="display: inline-block; width: auto; vertical-align: top;">

        <span style="margin-left: 8px;">
            Allow self-signed certificate
        </span>
    </div>

    <div class="form-tips">
        Enable this only when the HCU uses a self-signed TLS certificate.
    </div>
</script>


<script type="text/html" data-help-name="New HCU connection">
    <p>
        Creates a Connect API authentication token and confirms it with the
        Homematic HCU.
    </p>


    <h3>Operation</h3>

    <p>
        Connect an input node to this node to start the authentication sequence.
        Each incoming message triggers one authentication sequence.
    </p>

    <p>
        The node first calls
        <code>/hmip/auth/requestConnectApiAuthToken</code>
        and then calls
        <code>/hmip/auth/confirmConnectApiAuthToken</code>
        using the returned authToken.
    </p>


    <h3>TLS certificate</h3>

    <p>
        Enable <b>Allow self-signed certificate</b> only for an HCU that uses a
        self-signed TLS certificate. When enabled, certificate verification is
        disabled for these requests.
    </p>


    <h3>Output</h3>

    <p>
        On success, the incoming message is passed through and
        <code>msg.payload</code> contains the authToken, clientId,
        and both response bodies.
    </p>

    <pre>{
  authToken: "...",
  clientId: "...",
  requestResponse: { ... },
  confirmResponse: { ... }
}</pre>

    <p>
        On failure, the incoming message is passed through with the error
        information in <code>msg.payload.error</code>.
    </p>


    <h3>Security</h3>

    <p>
        The activation key and returned authToken are sensitive values.
        Protect the flow and Node-RED instance accordingly. Do not connect this
        output to a Debug node in production and do not store the complete output
        in persistent flow or global context without additional protection.
    </p>
</script>
